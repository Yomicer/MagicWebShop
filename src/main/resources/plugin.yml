name: MagicWebShop
version: ${project.version}${build.suffix}
main: com.magic.webshop.MagicWebShop
api-version: '1.20'
authors: [MagicWebShop]
description: 跨服物品交易插件，网页商城。我的世界版"淘宝"。
softdepend: [Vault]

commands:
  webshop:
    description: 打开 MagicWebShop 菜单 / 管理你的上架。
    usage: /webshop
    aliases: [mws, ws, shop]

permissions:
  webshop.use:
    description: 使用 MagicWebShop（浏览、出售、购买）。
    default: true
  webshop.admin:
    description: 管理 MagicWebShop（重载、查看网址、下架任意上架）。
    default: op
