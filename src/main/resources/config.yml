# ==========================================================================
#  ✨ MagicWebShop 配置文件 ✨
#  跨服物品交易小可爱插件（我的世界版"淘宝"），自带网页商城。
#  每个选项都写好啦，照着调一调就能用～
# ==========================================================================

# 本服的小名号，会挂在它发布的每个商品旁，让买家一眼认出你是哪个服。
# 整个网络里每个服的小名号都不要重样哦。
server-name: "Server-1"

# ---------------------------------------------------------------------------
#  网页 / HTTP 设置
# ---------------------------------------------------------------------------
web:
  # 网页商城 + 跨服 API 监听的端口。必须能被 peers 里列出的【其它服务器】访问到。
  # 填 0 或 auto 表示自动挑一个空闲端口；若填的端口被占用，也会自动改用空闲端口。
  # 注意：做跨服时请填一个【固定且可达】的端口，否则对端找不到本服啦。
  port: 25565
  # 玩家执行 /webshop web 时看到的网址：
  #   "auto"                -> 插件自动探测服务器公网 IP，你只需设好上面的端口。
  #   "play.myserver.cn"    -> 域名（会自动补上端口） 强烈建议使用域名，因为部分服务器不允许直接IP访问网页。
  #   "http://1.2.3.4:8085" -> 完整网址（原样使用）
  public-url: "auto"
  # HTTP 服务器绑定地址。0.0.0.0 表示监听所有网卡。
  bind: "0.0.0.0"
  # 【进阶玩法】是否让网页复用 Minecraft 游戏端口（无需单独开一个端口/隧道）。
  #   false = 默认，网页用上面的独立端口（最稳定，推荐）。
  #   true  = 注入服务端 Netty 管线，用游戏端口同时提供网页；玩家访问
  #           http://你的IP:游戏端口 即可。属于进阶功能，依赖服务端内部实现，
  #           大版本更新后可能需要适配；若注入失败会自动回退到独立端口。
  share-server-port: true
  # 网页商品列表：一页最多展示几行（每行数量随窗口宽度自动变化）。
  shop-rows-per-page: 7
  # 玩家默认的列表浏览模式：pages = 翻页 / loadmore = 加载更多（玩家可在网页自行切换）。
  shop-default-view: "pages"

# 服务器之间互相通信的共享小秘密。
# 网络中【所有服务器都必须填成相同的值】。
# 正式使用前请改成一串足够长的随机字符。
network-secret: "change-me-to-a-long-random-secret"

# ---------------------------------------------------------------------------
#  对端服务器（你的玩家可以与之交易的其它商城）
#  每个远程服务器写一条：
#    - 单条链路用 address: "主机:网页端口"
#    - 多条链路用 addresses:（链路聚合）——按顺序尝试，用第一条能连通的，
#      适合"内网直连优先、公网/frp 备用"的场景，一条断了自动切换到另一条。
#  可以填任意多个对端服务器。`name` 必须等于对方的 server-name。
#  【重要】跨服交易必须【双方互配】：对方服务器也要在它的 peers 里写上你，
#  且两边的 network-secret 一致，交易才会生效。不支持单向交易（防止一方漏配
#  造成商品被单边看到/买走）。
# ---------------------------------------------------------------------------
peers:
  - name: "Server-2"
    addresses:
      - "play.otherserver.cn:25565"  # 强烈建议使用域名，因为部分服务器不允许直接IP访问网页。
      - "192.168.1.20:8085"          # 内网直连（优先，速度快）
      - "cn-hk.sakurafrp.com:23456"  # 公网/樱花frp 备用链路
  # - name: "Server-3"
  #   address: "shop.example.com:8085"   # 也可只写单条 address

# 每隔多少秒刷新一次从对端缓存的商品目录。
peer-refresh-seconds: 15

# ---------------------------------------------------------------------------
#  收货方式（买到的宝贝去哪里）
# ---------------------------------------------------------------------------
delivery:
  # 玩家默认的收货方式：
  #   backpack = 直接推送到背包（背包装不下会自动进邮箱）
  #   mailbox  = 购买的物品全部进邮箱（/webshop mailbox 领取）
  # 玩家可以用 /webshop delivery <backpack|mailbox> 随时自己切换。
  default-mode: "mailbox"

# ---------------------------------------------------------------------------
#  自动更新（懒人福音）
# ---------------------------------------------------------------------------
# 开启后，插件会定时去 GitHub 看看有没有新版本，发现新版本就自动下载新 jar
# 到 plugins/ 目录，重启服务器后生效。
auto-update: false
# 检查更新的仓库地址（填 GitHub 仓库首页即可）。
update-repo: "https://github.com/Yomicer/MagicWebShop"
# 更新镜像前缀（留空 = 直连 GitHub）。
# 若服务器访问 GitHub 不稳定 / 被网络拦截（报 TLS 证书类错误），可填一个
# 反代 GitHub 的镜像地址，例如 https://ghproxy.net/ 这类，插件会在原网址前
# 自动拼上这个前缀来检查和下载。镜像可用性请自行测试。
update-mirror: ""

# ---------------------------------------------------------------------------
#  经济
# ---------------------------------------------------------------------------
economy:
  # 需要 Vault + 一个经济插件。设为 false 时只允许"以物换物"。
  enabled: true
  # 网页上显示的货币符号。
  currency-symbol: "$"
  # 金钱交易时向卖家收取的手续费（百分比 0-100）。0 = 不收费。
  sell-fee-percent: 0
  # 一口价是否随剩余数量波动：true 时「全部买下」的一口价 = 原价 × 剩余/原始数量
  #（卖出越多，剩余整堆的一口价越低）；false 时一口价固定不变。
  flat-follows-stock: true

# ---------------------------------------------------------------------------
#  网页商城的物品贴图
#  贴图会在首次使用时从公开的资源镜像下载一次，缓存到
#  plugins/MagicWebShop/textures/，之后本地直供。若某贴图找不到或服务器
#  无外网，则自动使用内置生成的图标兜底，界面始终美美的、不会裂图。
# ---------------------------------------------------------------------------
texture:
  # 使用哪个版本的贴图，请与你的服务器版本保持一致。
  version: "1.20.4"
  # 资源镜像根地址（到 ".../textures" 目录为止），{version} 会被自动替换。
  # 默认使用 assets.mcasset.cloud（按版本提供完整资源的可靠镜像）。
  cdn-base: "https://assets.mcasset.cloud/{version}/assets/minecraft/textures"
  # 可选：强制使用某个按物品名返回图片的直链图床，代替上面的下载+缓存。
  # {material} 会被替换成例如 diamond_sword。留空即使用内置下载+缓存（推荐）。
  cdn-template: ""
  # 可选：服务器材质包目录。把你服务器用的材质包【解压】后，把里面的
  # assets 文件夹（以及 pack.mcmeta）所在的那一层目录填在这里，例如
  # "texture_resource" 或 "plugins/MagicWebShop/resourcepack"。
  # 留空时会【自动探测】服务器根目录下的 texture_resource / resourcepack 等常见目录。
  # 设置后会【优先】使用材质包里的贴图，找不到再回退到原版镜像。
  # 自动支持三种自定义物品：头颅皮肤、CustomModelData 模型、以及 1.21.4+ 的
  # item_model 组件，尽量还原材质包里的真实外观。改完执行 /webshop reload 即可生效。
  resource-pack-dir: ""

# 玩家店铺页的头像：优先从 Mojang / mc-heads / crafatar 在线解析皮肤；
# 服务器无法访问外网或离线模式解析不到时，自动使用"像素风玩家头"兜底。
# 想要指定真实头像，把 64x64 的 PNG 放到 plugins/MagicWebShop/avatars/ 目录下，
# 文件名用玩家名（如 Steve.png）或玩家 UUID（如 12345678-...-.png）即可。

# 限制
limits:
  # 每名玩家最多同时上架的数量。
  max-listings-per-player: 27
  # 金钱交易允许的最高价格，超过则拒绝上架。0 = 不限制。
  max-price: 0
  # 是否允许玩家购买/换走自己上架的商品。
  # false = 禁止（默认，防止刷交易）；true = 允许。
  allow-self-purchase: false

# 邮箱
mailbox:
  # 邮箱最多显示多少页（每页 45 格）。超出的物品会等前面的领取后再显示。
  max-pages: 5

# ---------------------------------------------------------------------------
#  全服广播（聊天栏公告）— 可独立开关
#  每项都是概率 0-100：0 = 关闭该广播；100 = 每次都播；中间值 = 随机播报。
#  上架/成交/换物各有一套随机文案模板（预设多款，每次随机挑一条播）。
# ---------------------------------------------------------------------------
broadcast:
  # 玩家上架商品时，向全服广播的概率（含跨服同步）。0 关闭。
  listing-chance: 100
  # 金钱交易成交时，向全服广播的概率。0 关闭。
  sale-chance: 100
  # 以物换物成功时，向全服广播的概率。0 关闭。
  barter-chance: 100
