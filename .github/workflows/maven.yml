name: MagicWebShop

on:
  push:
    branches: [main]   # ← 改成你仓库的默认分支名

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 本次推送的相关信息（统一从 push 事件里取）
      PUSHER: ${{ github.event.pusher.name }}
      COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
      COMMIT_EMAIL: ${{ github.event.head_commit.author.email }}
      PUSH_TIME: ${{ github.event.head_commit.timestamp }}
      TRIGGER_ACTOR: ${{ github.actor }}
      BRANCH: ${{ github.ref_name }}
      COMMIT_SHA: ${{ github.sha }}
      COMMIT_MSG: ${{ github.event.head_commit.message }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'      # ← 与 pom.xml 的 maven.compiler.release 保持一致
          distribution: 'temurin'
          cache: maven

      - name: 记录构建开始时间
        id: start
        run: |
          echo "epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - name: 读取插件版本
        id: version
        run: |
          echo "value=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: 使用 Maven 构建
        # 注入构建标识：plugin.yml 版本变为 1.0.0-Build-<运行号>，
        # 服主服务器用它和 GitHub 最新 tag 对比来决定是否更新。
        run: mvn -B package --file pom.xml -Dbuild.suffix=-Build-${{ github.run_number }}

      - name: 整理并记录构建信息
        if: success()
        run: |
          START_EPOCH='${{ steps.start.outputs.epoch }}'
          BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          DURATION="$(( $(date -u +%s) - START_EPOCH )) 秒"
          MSG="$(printf '%s' "$COMMIT_MSG" | head -n 1)"
          SHORT_SHA="$(printf '%s' "$COMMIT_SHA" | cut -c1-7)"

          cat > target/build-info.md <<EOF
          # 魔法集市 MagicWebShop 构建信息

          | 项目 | 值 |
          | --- | --- |
          | 插件版本 | v${{ steps.version.outputs.value }} |
          | 推送人 | ${PUSHER} |
          | 触发者 | ${TRIGGER_ACTOR} |
          | 提交作者 | ${COMMIT_AUTHOR} <${COMMIT_EMAIL}> |
          | 推送时间 | ${PUSH_TIME} |
          | 构建开始 | ${{ steps.start.outputs.time }} |
          | 构建成功时间 | ${BUILD_TIME} |
          | 构建耗时 | ${DURATION} |
          | 分支 | ${BRANCH} |
          | 提交 | ${SHORT_SHA} |
          | 提交说明 | ${MSG} |
          | 构建编号 | #${{ github.run_number }} |
          | 工作流日志 | ${RUN_URL} |
          EOF

          cat target/build-info.md
          cat target/build-info.md >> "$GITHUB_STEP_SUMMARY"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MagicWebShop-Build-${{ github.run_number }}
          path: |
            target/*.jar
            target/build-info.md

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.jar
          body_path: target/build-info.md
          tag_name: v${{ steps.version.outputs.value }}-Build-${{ github.run_number }}
          name: MagicWebShop v${{ steps.version.outputs.value }} - Build ${{ github.run_number }}
